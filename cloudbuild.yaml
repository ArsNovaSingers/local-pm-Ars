steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg DATABASE_URI="$$DATABASE_URI" \
          --build-arg PAYLOAD_SECRET="$$PAYLOAD_SECRET" \
          --build-arg NEXT_PUBLIC_SERVER_URL="$_NEXT_PUBLIC_SERVER_URL" \
          -t us-central1-docker.pkg.dev/$PROJECT_ID/local-pm-repo/app:latest .
    secretEnv: ['DATABASE_URI', 'PAYLOAD_SECRET']
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/local-pm-repo/app:latest'
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/local-pm-database-uri/versions/latest
      env: 'DATABASE_URI'
    - versionName: projects/$PROJECT_ID/secrets/local-pm-payload-secret/versions/latest
      env: 'PAYLOAD_SECRET'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
timeout: '1200s'
